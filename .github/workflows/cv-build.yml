name: Build & Render CV

on:
  push:
    paths:
      - 'cv/**'
      - 'data/about/**'
      - 'scripts/generate-cv-tex.mjs'
      - '.github/workflows/cv-build.yml'
  workflow_dispatch:

jobs:
  build-latex:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate LaTeX template from modular data
        run: node scripts/generate-cv-tex.mjs

      - name: Compile LaTeX CV (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: template.tex
          working_directory: cv
          latexmk_use_xelatex: true
          args: -interaction=nonstopmode -halt-on-error

      - name: Move generated PDF to public directory
        run: |
          mkdir -p public
          cp cv/template.pdf public/cv.pdf

      - name: Upload PDF Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: public/cv.pdf
