name: PR checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# ---------------------------------------------------------------------------
# Consolidated PR gate.
#
# Every quality check runs as its own parallel job. Each runs its command in a
# step marked `continue-on-error` and exports the step outcome as a job output,
# so one failing check never short-circuits the others. The `conclusion` job
# aggregates all outcomes into ONE report (job summary + a single sticky PR
# comment) and is the single required status check ("PR checks") that blocks
# merge — it fails only when a *blocking* check failed.
#
#   Blocking : lockfile, lint, typecheck, seo, unit (+coverage), build, e2e-visual
#
# Nothing here writes to the repository. The visual baselines in
# `tests/__snapshots__` are compared against, never regenerated: a visual diff
# fails the gate and stays failed until a human looks at it and asks for a new
# baseline by commenting `/update-snapshots` on the PR
# (`update-snapshots-command.yml` is the only workflow that pushes them).
#
# No Sentric composite actions, no `gh aw` agentic layer — the report is built
# deterministically from the job outcomes.
#
# REQUIRED CHECK (branch protection): "PR checks" (the conclusion job).
# ---------------------------------------------------------------------------

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Fast, install-free guard: a git/SSH dependency resolution in the lockfile
  # clones over a protocol cold builds can't authenticate (Vercel: "Host key
  # verification failed"). Reads the lockfile text directly, so — unlike the
  # install-based jobs whose warm pnpm store can mask a bad resolution — it
  # catches the regression that broke main in PR #79.
  lockfile:
    name: lockfile
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.lockfile.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: blog/.nvmrc
      - id: lockfile
        continue-on-error: true
        working-directory: blog
        run: node scripts/ci/check-lockfile-protocol.mjs

  lint:
    name: lint
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.lint.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: ./blog/.github/actions/setup-blog
      - id: lint
        continue-on-error: true
        working-directory: blog
        run: pnpm lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.typecheck.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: ./blog/.github/actions/setup-blog
      - id: typecheck
        continue-on-error: true
        working-directory: blog
        run: pnpm typecheck

  seo:
    name: seo
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.seo.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: ./blog/.github/actions/setup-blog
      - id: seo
        continue-on-error: true
        working-directory: blog
        run: pnpm check:seo

  unit:
    name: test
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.unit.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: ./blog/.github/actions/setup-blog
        with:
          install-playwright: "true"
      - id: unit
        continue-on-error: true
        working-directory: blog
        run: pnpm test:coverage
      - name: Upload PR coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-pr
          path: blog/coverage/
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    outputs:
      outcome: ${{ steps.build.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: ./blog/.github/actions/setup-blog
      - id: build
        continue-on-error: true
        working-directory: blog
        run: pnpm build
      - name: Upload build output
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-output
          path: |
            blog/.next/
            blog/public/
          retention-days: 1
          include-hidden-files: true

  e2e-visual:
    name: visual
    runs-on: ubuntu-latest
    needs: build
    # Read-only. This job compares against the committed baselines and never
    # writes them; re-baselining is a `/update-snapshots` comment away
    # (update-snapshots-command.yml), which is the only path that pushes.
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.e2e.outcome }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
          # The default `pull_request` merge ref, deliberately: the build job
          # checks out the same ref, so the baselines and specs used here
          # describe the tree that produced the artifact being served. Checking
          # out the branch tip instead (as this job did while it committed
          # snapshots back) diffs a merge-ref build against branch-tip
          # baselines, which invents differences on any branch behind main.
      - uses: ./blog/.github/actions/setup-blog
        with:
          install-playwright: "true"
      - name: Download build output
        if: needs.build.outputs.outcome == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output
          path: blog/
      - id: e2e
        # Only run if the build produced an artifact to serve.
        if: needs.build.outputs.outcome == 'success'
        continue-on-error: true
        working-directory: blog
        # Playwright's webServer config runs `pnpm run serve` (next start)
        # against the downloaded build; this includes visual.spec.ts /
        # visual-responsive.spec.ts regression specs.
        #
        # `--update-snapshots=none` is the whole point of this gate: nothing on
        # this runner may write a baseline. A bare `--update-snapshots` presets
        # to `changed`, and this step ran exactly that until now — every visual
        # diff was re-recorded as the new expectation, the suite passed, and a
        # bot commit pushed the rewritten PNGs back to the branch. The check
        # reported "E2E + visual regression ✅ Passed" on a PR it had just
        # silently re-baselined 13 files for (#109, 0a436e2). A gate that
        # rewrites the thing it compares against cannot fail, so it was not a
        # gate.
        #
        # `none` also covers the missing-baseline case: a new screenshot fails
        # here rather than being written to a runner that is about to be
        # destroyed. Either way the answer is the same — look at the diff in the
        # Playwright report, and if the change is intended, say so out loud by
        # commenting `/update-snapshots` on the PR.
        run: pnpm exec playwright test --update-snapshots=none
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: blog/playwright-report/
          retention-days: 30
          if-no-files-found: ignore

  conclusion:
    name: pr-checks
    runs-on: ubuntu-latest
    needs: [lockfile, lint, typecheck, seo, unit, build, e2e-visual]
    if: always()
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: blog/.nvmrc

      - name: Download PR coverage
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-pr
          path: coverage-pr/

      - name: Find latest main coverage baseline
        id: baseline
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              branch: 'main',
              status: 'success',
              per_page: 1,
            });
            if (runs.data.workflow_runs.length) {
              core.setOutput('found', 'true');
              core.setOutput('run_id', String(runs.data.workflow_runs[0].id));
            } else {
              core.setOutput('found', 'false');
            }

      - name: Download main coverage baseline
        if: steps.baseline.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: coverage-main
          path: coverage-main/
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build consolidated report
        env:
          LOCKFILE: ${{ needs.lockfile.outputs.outcome }}
          LINT: ${{ needs.lint.outputs.outcome }}
          TYPECHECK: ${{ needs.typecheck.outputs.outcome }}
          SEO: ${{ needs.seo.outputs.outcome }}
          UNIT: ${{ needs.unit.outputs.outcome }}
          BUILD: ${{ needs.build.outputs.outcome }}
          E2E: ${{ needs.e2e-visual.outputs.outcome }}
        shell: bash
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          icon() {
            case "$1" in
              success) echo "✅ Passed" ;;
              failure) echo "❌ Failed" ;;
              skipped) echo "⏭️ Skipped" ;;
              *)       echo "⏭️ Skipped" ;;
            esac
          }

          coverage_md=$(
            node blog/scripts/ci/coverage-delta.mjs \
              coverage-pr/coverage-summary.json \
              coverage-main/coverage-summary.json 2>/dev/null \
            || echo "> ⚠️ Coverage delta unavailable."
          )

          {
            echo "<!-- pr-checks-summary -->"
            echo "## PR checks"
            echo ""
            echo "| Check | Result | Gate |"
            echo "| ----- | ------ | ---- |"
            echo "| Lockfile protocol guard | $(icon "$LOCKFILE") | blocking |"
            echo "| Lint (biome) | $(icon "$LINT") | blocking |"
            echo "| Type check (tsc) | $(icon "$TYPECHECK") | blocking |"
            echo "| SEO audit | $(icon "$SEO") | blocking |"
            echo "| Unit tests + coverage | $(icon "$UNIT") | blocking |"
            echo "| Build | $(icon "$BUILD") | blocking |"
            echo "| E2E + visual regression | $(icon "$E2E") | blocking |"
            echo ""
            if [ "$E2E" = "failure" ]; then
              echo "> **Visual diff?** Open the \`playwright-report\` artifact on the"
              echo "> [E2E job]($run_url) to see expected / actual / diff. The baselines are"
              echo "> never regenerated automatically — if the change is intended, comment"
              echo "> \`/update-snapshots\` (add \`all\` to re-record baselines that already"
              echo "> exist) and CI will rebuild them and push them to this branch."
              echo ""
            fi
            echo "### Coverage (vs \`main\`)"
            echo ""
            echo "$coverage_md"
          } > pr-summary.md

          cat pr-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post sticky PR comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('pr-summary.md', 'utf8');
            const marker = '<!-- pr-checks-summary -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            );
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Gate on blocking checks
        env:
          LOCKFILE: ${{ needs.lockfile.outputs.outcome }}
          LINT: ${{ needs.lint.outputs.outcome }}
          TYPECHECK: ${{ needs.typecheck.outputs.outcome }}
          SEO: ${{ needs.seo.outputs.outcome }}
          UNIT: ${{ needs.unit.outputs.outcome }}
          BUILD: ${{ needs.build.outputs.outcome }}
          E2E: ${{ needs.e2e-visual.outputs.outcome }}
        shell: bash
        run: |
          failed=false
          # E2E (incl. visual regression) is blocking. When build fails it is
          # skipped (empty outcome), not a failure here — the build failure
          # already blocks.
          for check in LOCKFILE LINT TYPECHECK SEO UNIT BUILD E2E; do
            if [ "${!check}" = "failure" ]; then
              echo "::error::${check} failed — blocking merge"
              failed=true
            fi
          done
          if [ "$failed" = "true" ]; then
            exit 1
          fi
          echo "All blocking checks passed."
