name: CI

# Main-branch baseline. Runs the full suite on every push to main and publishes
# the coverage summary as the `coverage-main` artifact that PR runs diff against
# (see pr-checks.yml → conclusion → "Find latest main coverage baseline").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Build, test & publish coverage baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: blog
      - uses: ./blog/.github/actions/setup-blog
        with:
          install-playwright: "true"

      - name: Lint
        working-directory: blog
        run: pnpm lint

      - name: Type check
        working-directory: blog
        run: pnpm typecheck

      - name: Unit tests with coverage
        working-directory: blog
        run: pnpm test:coverage

      - name: Build
        working-directory: blog
        run: pnpm build

      - name: SEO audit
        working-directory: blog
        run: pnpm check:seo

      # Stable baseline for the PR coverage-diff. retention-days is the GitHub
      # Actions maximum (400) to approximate indefinite retention — every main
      # push overwrites it, so it never expires in practice.
      - name: Upload coverage baseline (main only)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-main
          path: blog/coverage/
          retention-days: 400
          overwrite: true
          if-no-files-found: warn
