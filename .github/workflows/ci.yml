name: CI

# Main-branch baseline. Runs the full suite on every push to main and publishes
# the coverage summary as the `coverage-main` artifact that PR runs diff against
# (see pr-checks.yml → conclusion → "Find latest main coverage baseline").

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Build, test & publish coverage baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          path: blog
      - uses: ./blog/.github/actions/setup-blog
        with:
          install-playwright: "true"

      - name: Lockfile protocol guard
        working-directory: blog
        run: node scripts/ci/check-lockfile-protocol.mjs

      - name: Lint
        working-directory: blog
        run: pnpm lint

      - name: Type check
        working-directory: blog
        run: pnpm typecheck

      - name: Unit tests with coverage
        working-directory: blog
        run: pnpm test:coverage

      - name: Build
        working-directory: blog
        run: pnpm build

      # Published from main so PR runs have something to diff their own
      # benchmark against — same pattern as the coverage baseline above.
      - name: Graphics benchmark
        if: always()
        continue-on-error: true
        working-directory: blog
        run: pnpm bench:graphics
      - name: Upload graphics benchmark baseline (main only)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graphics-benchmark-main
          path: blog/docs/graphics-benchmark.md
          retention-days: 30
          if-no-files-found: ignore

      - name: SEO audit
        working-directory: blog
        run: pnpm check:seo

      # Stable baseline for the PR coverage-diff. retention-days is the GitHub
      # Actions maximum (400) to approximate indefinite retention — every main
      # push overwrites it, so it never expires in practice.
      - name: Upload coverage baseline (main only)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-main
          path: blog/coverage/
          retention-days: 400
          overwrite: true
          if-no-files-found: warn
