name: Setup blog
description: >-
  Shared prelude for blog CI jobs — checks out the mermaid-toolkit sibling repo,
  installs pnpm + Node, builds the toolkit, and installs blog dependencies.
  Repo-local composite action (no third-party/Sentric actions). The caller must
  check out the blog itself first (default into `blog/`) so this action file is
  available, then `uses: ./blog/.github/actions/setup-blog`.

inputs:
  blog-path:
    description: Path the blog repo was checked out to.
    required: false
    default: blog
  install-playwright:
    description: >-
      When "true", install the Chromium browser Playwright needs (used by the
      vitest/Storybook browser-mode unit tests and the e2e/visual specs).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Checkout mermaid-toolkit
      uses: actions/checkout@v4
      with:
        repository: rtkelly13/mermaid-toolkit
        path: mermaid-toolkit

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.blog-path }}/.nvmrc
        cache: pnpm
        cache-dependency-path: ${{ inputs.blog-path }}/pnpm-lock.yaml

    - name: Build mermaid-toolkit
      working-directory: mermaid-toolkit
      shell: bash
      run: pnpm install && pnpm build

    - name: Install dependencies
      working-directory: ${{ inputs.blog-path }}
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Install Playwright Chromium
      if: inputs.install-playwright == 'true'
      working-directory: ${{ inputs.blog-path }}
      shell: bash
      run: pnpm exec playwright install --with-deps chromium
